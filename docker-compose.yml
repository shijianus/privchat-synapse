version: "3.9"

# Matrix Synapse + Dashboard full stack orchestration
# Services:
#  - synapse (Matrix homeserver)
#  - dashboard-backend (API)
#  - dashboard-frontend (UI)
#  - dashboard-bot (Matrix bot)
#  - postgres (DB)
#  - redis (Cache/pubsub)
#  - nginx (reverse proxy + TLS termination)

name: matrix-dashboard

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize dashboard schema on first DB init
      - ./dashboard/schema/dashboard_schema.sql:/docker-entrypoint-initdb.d/20-dashboard_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - matrix

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - matrix

  synapse:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: synapse
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS}
      SYNAPSE_NO_TLS: ${SYNAPSE_NO_TLS:-1}
      SYNAPSE_ENABLE_REGISTRATION: ${SYNAPSE_ENABLE_REGISTRATION:-yes}
      SYNAPSE_ALLOW_GUEST: ${SYNAPSE_ALLOW_GUEST:-no}
      SYNAPSE_HTTP_PORT: ${SYNAPSE_HTTP_PORT:-8008}
      SYNAPSE_REGISTRATION_SHARED_SECRET: ${SYNAPSE_REGISTRATION_SHARED_SECRET}
      SYNAPSE_MACAROON_SECRET_KEY: ${SYNAPSE_MACAROON_SECRET_KEY}
      SYNAPSE_EVENT_CACHE_SIZE: ${SYNAPSE_EVENT_CACHE_SIZE:-10K}
      SYNAPSE_DASHBOARD_CACHE_TTL_SECONDS: ${SYNAPSE_DASHBOARD_CACHE_TTL_SECONDS:-300}
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
      SYNAPSE_CONFIG_DIR: /data
      SYNAPSE_LOG_CONFIG: /data/log.config
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:-synapse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-synapse}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: UTC
    volumes:
      - synapse_data:/data
    expose:
      - "8008"
    command: >
      /bin/sh -c "if [ ! -f /data/homeserver.yaml ]; then /start.py migrate_config; fi && /start.py run"
    networks:
      - matrix

  dashboard-backend:
    build:
      context: ./dashboard/backend
    container_name: dashboard-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env.production
    environment:
      # Required for DB/Redis connectivity
      DATABASE_URL: ${DATABASE_URL:-postgresql://synapse:${POSTGRES_PASSWORD}@postgres:5432/synapse}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      JWT_SECRET: ${JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    expose:
      - "3001"
    networks:
      - matrix

  dashboard-frontend:
    build:
      context: ./dashboard/frontend
    container_name: dashboard-frontend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Vite build-time envs (used by Nginx-served static site)
      VITE_API_URL: ${VITE_API_URL}
      VITE_MATRIX_SERVER: ${VITE_MATRIX_SERVER}
      VITE_APP_NAME: ${VITE_APP_NAME:-Matrix Dashboard}
      VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - matrix

  dashboard-bot:
    build:
      context: ./dashboard/bot
    container_name: dashboard-bot
    restart: unless-stopped
    depends_on:
      - synapse
      - dashboard-backend
      - postgres
      - redis
    env_file:
      - .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/0}
      MATRIX_BOT_USERNAME: ${MATRIX_BOT_USERNAME}
      MATRIX_BOT_PASSWORD: ${MATRIX_BOT_PASSWORD}
      MATRIX_BOT_HOMESERVER: ${MATRIX_BOT_HOMESERVER}
      BOT_ADMIN_ROOM_ID: ${BOT_ADMIN_ROOM_ID}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
    expose:
      - "3002"
    networks:
      - matrix

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      - synapse
      - dashboard-backend
      - dashboard-frontend
    ports:
      - "80:80"
      - "443:443"
      - "8448:8448"   # Matrix federation
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/matrix.conf:/etc/nginx/conf.d/matrix.conf:ro
      - ./docker/nginx/dashboard.conf:/etc/nginx/conf.d/dashboard.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - matrix

networks:
  matrix:
    name: matrix

volumes:
  postgres_data:
  redis_data:
  synapse_data:
