# Matrix Synapse Federation Configuration
upstream matrix_synapse {
    server synapse:8008;
    keepalive 64;
}

# Matrix server configuration
server {
    listen 80;
    listen [::]:80;
server_name matrix.localhost localhost;

    # Well-known configuration for client
    location /.well-known/matrix/client {
        return 200 '{"m.homeserver": {"base_url": "https://$host"}, "m.identity_server": {"base_url": "https://vector.im"}}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Well-known configuration for server
    location /.well-known/matrix/server {
        return 200 '{"m.server": "$host:443"}';
        add_header Content-Type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Redirect to HTTPS for everything else
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS Matrix server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
server_name matrix.localhost localhost;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=matrix_conn_limit_per_ip:10m;
    limit_conn matrix_conn_limit_per_ip 50;

    # Client API routes
    location /_matrix/client/ {
        # Rate limiting for client API
        limit_req zone=matrix_client burst=100 nodelay;

        proxy_pass http://matrix_synapse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Client-specific timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings for large requests
        client_max_body_size 50M;
        proxy_buffering off;
    }

    # Login endpoints with stricter rate limiting
    location /_matrix/client/r0/login {
        limit_req zone=matrix_login burst=5 nodelay;

        proxy_pass http://matrix_synapse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Login timeout
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Media upload endpoints
    location /_matrix/media/ {
        limit_req zone=matrix_upload burst=10 nodelay;
        client_max_body_size 50M;

        proxy_pass http://matrix_synapse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload timeout
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Federation API (for server-to-server communication)
    location /_matrix/federation/ {
        # Rate limiting for federation
        limit_req zone=matrix_federation burst=200 nodelay;

        proxy_pass http://matrix_synapse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Federation-specific settings
        client_max_body_size 100M;
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Allow federation from specific servers only
        # Uncomment and configure as needed
        # allow 172.17.0.0/16;  # Docker network
        # deny all;
    }

    # Server key and version
    location /_matrix/key/ {
        proxy_pass http://matrix_synapse;
        proxy_set_header Host $host;
    }

    location /_matrix/server/ {
        proxy_pass http://matrix_synapse;
        proxy_set_header Host $host;
    }

    # Static files and media
    location /_matrix/media/ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";

        proxy_pass http://matrix_synapse;
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
    }

    # Synapse admin interface (if enabled)
    location /_synapse/admin/ {
        # Restrict access to admin interface
        # allow 127.0.0.1;
        # allow 172.17.0.0/16;  # Docker network
        # deny all;

        proxy_pass http://matrix_synapse;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check endpoint
    location /health {
        access_log off;
        proxy_pass http://matrix_synapse/_matrix/client/versions;
    }

    # Static file serving
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff";

        proxy_pass http://matrix_synapse;
    }

    # Security: Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=matrix_client:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=matrix_login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=matrix_upload:10m rate=2r/s;
    limit_req_zone $binary_remote_addr zone=matrix_federation:10m rate=100r/s;
}

# Federation port (8448)
server {
    listen 8448 ssl http2;
    listen [::]:8448 ssl http2;
    server_name matrix.example.com;

    # SSL configuration (same as above)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Federation only
    location / {
        # Only allow federation endpoints
        location /_matrix/federation/ {
            limit_req zone=matrix_federation burst=200 nodelay;

            proxy_pass http://matrix_synapse;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 100M;
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # Server key for federation
        location /_matrix/key/ {
            proxy_pass http://matrix_synapse;
            proxy_set_header Host $host;
        }

        # Deny everything else on federation port
        deny all;
    }
}
