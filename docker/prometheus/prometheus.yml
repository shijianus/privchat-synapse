# Prometheus 最小配置
global:
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # 可按需扩展服务的 metrics 暴露端点
  - job_name: 'synapse'
    metrics_path: /_synapse/metrics
    static_configs:
      - targets: ['synapse:8008']

  - job_name: 'dashboard-backend'
    metrics_path: /metrics
    static_configs:
      - targets: ['dashboard-backend:3001']

  - job_name: 'dashboard-bot'
    metrics_path: /metrics
    static_configs:
      - targets: ['dashboard-bot:3002']

