server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: synapse-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: synapse
          __path__: /var/log/synapse/*.log

  - job_name: backend-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: dashboard-backend
          __path__: /var/log/backend/*.log

  - job_name: bot-logs
    static_configs:
      - targets: [localhost]
        labels:
          job: dashboard-bot
          __path__: /var/log/bot/*.log

