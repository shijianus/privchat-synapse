# PostgreSQL 生产配置（最小可用示例）
# 说明：该文件挂载于容器 /etc/postgresql/postgresql.conf
# 可按需根据机器资源进行调优。以下参数为通用安全配置。

listen_addresses = '*'
max_connections = 200
shared_buffers = 512MB
effective_cache_size = 1536MB
maintenance_work_mem = 256MB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200
work_mem = 16MB
min_wal_size = 512MB
max_wal_size = 2GB
log_timezone = 'UTC'
timezone = 'UTC'

